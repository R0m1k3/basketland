services:
  basketland:
    image: ghcr.io/r0m1k3/basketland:latest
    container_name: basketland
    restart: unless-stopped
    # Carte NVIDIA pour la traduction des commentaires (Whisper + Ollama
    # embarqués) : plugin « Nvidia Driver » installé sur Unraid.
    runtime: nvidia
    ports:
      - '3012:3012'
    environment:
      TZ: Europe/Paris
      NVIDIA_VISIBLE_DEVICES: all
      # Cartes visibles, numéros de `nvidia-smi` : 0 (RTX 5060 Ti), 1 (RTX 3060).
      CUDA_VISIBLE_DEVICES: '0,1'
      # Une carte chacun : traduction (Ollama) sur la 5060 Ti, transcription
      # (Whisper) sur la 3060 ; le modèle de traduction a la sienne en entier.
      OLLAMA_CUDA_DEVICE: '0'
      WHISPER_CUDA_DEVICE: '1'
      # Jeton d'accès à /api/ingest (les jobs de synchronisation).
      # À définir dans l'UI Unraid ; sinon un jeton est généré dans /data.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      # Clé API MiniMax : traduction des commentaires en ligne (facultatif).
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    volumes:
      - /mnt/user/appdata/basketland:/data
    healthcheck:
      # Plus de Node dans l'image : le serveur Rust fait le contrôle lui-même.
      test: ['CMD', 'basketland-server', 'health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
