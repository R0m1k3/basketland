services:
  basketland:
    image: ghcr.io/r0m1k3/basketland:latest
    container_name: basketland
    restart: unless-stopped
    # Carte NVIDIA pour la traduction des commentaires (Whisper + Ollama
    # embarqués) : plugin « Nvidia Driver » installé sur Unraid.
    runtime: nvidia
    ports:
      - '3012:3012'
    environment:
      TZ: Europe/Paris
      NVIDIA_VISIBLE_DEVICES: all
      # Jeton d'accès à /api/ingest (les jobs de synchronisation).
      # À définir dans l'UI Unraid ; sinon un jeton est généré dans /data.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      # Clé API MiniMax : voix françaises du doublage par MiniMax (sans GPU)
      # au lieu de Qwen3-TTS embarqué. Vide : Qwen3-TTS.
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    volumes:
      - /mnt/user/appdata/basketland:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3012/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
