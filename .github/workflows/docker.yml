name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full:
        description: "Construire aussi l'image complète (:full, avec Fish S2 Pro et Parakeet)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Serveur Rust (API, files médias, cron, interface statique).
      - name: Rust tests
        run: cargo test --manifest-path server/Cargo.toml --locked

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          docker image prune --all --force
          df -h /

      # Connexion aussi sur une pull request (même dépôt) : l'image de base
      # est lue, et publiée si elle manque, dans le registre.
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image de base (Dockerfile.base, plusieurs Go) : étiquetée par
      # l'empreinte de ses fichiers, construite seulement si elle n'existe
      # pas encore. Ses couches restent identiques d'une version à l'autre de
      # l'application : le NAS ne les télécharge qu'une fois.
      - name: Base image tag
        id: base
        run: |
          hash=$(cat Dockerfile.base scripts/voice-requirements.txt | sha256sum | cut -c1-16)
          name="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')-base"
          echo "image=${name}:lite-${hash}" >> "$GITHUB_OUTPUT"
          echo "moving=${name}:lite" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${name}:lite-${hash}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          target: lite
          push: true
          tags: |
            ${{ steps.base.outputs.image }}
            ${{ steps.base.outputs.moving }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Sur une pull request, l'image est construite SANS être publiée : une
      # erreur du Dockerfile est vue avant le merge, pas après.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # Étages légers (Node, Rust) : tout est mis en cache (mode=max) ;
          # un échec d'export du cache ne fait jamais échouer la publication.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # Image complète (:full) : Fish Audio S2 Pro (vLLM, ~10 Go) et NVIDIA
  # Parakeet en plus. Construite à la demande (« Run workflow », case
  # « full ») ou pour une version étiquetée.
  full:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          docker image prune --all --force
          df -h /

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Base image tag
        id: base
        run: |
          hash=$(cat Dockerfile.base scripts/voice-requirements.txt | sha256sum | cut -c1-16)
          name="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')-base"
          echo "image=${name}:full-${hash}" >> "$GITHUB_OUTPUT"
          echo "moving=${name}:full" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${name}:full-${hash}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          target: full
          push: true
          tags: |
            ${{ steps.base.outputs.image }}
            ${{ steps.base.outputs.moving }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=full
            type=semver,pattern={{version}},suffix=-full

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
