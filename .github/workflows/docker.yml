name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Une seule exécution à la fois par branche ou PR. Sur une PR, un nouveau commit
# annule l'exécution en cours ; sur main, on ne coupe jamais une publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Interface (Next.js) : types, tests, build.
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Serveur Rust (API, files médias, cron, interface statique), avec l'OCR natif
  # comme dans l'image Docker (fonction cargo `ocr`).
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install libtesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtesseract-dev libleptonica-dev

      # Version de Rust lue dans rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # Données de langue « eng » de Tesseract utilisées par les tests OCR
      # (paquet npm @tesseract.js-data/eng).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets --features ocr -- -D warnings

      - name: Tests
        run: cargo test --manifest-path server/Cargo.toml --locked --features ocr

  docker:
    needs: [node, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          docker image prune --all --force
          df -h /

      # Connexion aussi sur une pull request (même dépôt) : l'image de base est
      # lue dans le registre. Une PR ne publie jamais rien.
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image de base (Dockerfile.base, plusieurs Go) : étiquetée par
      # l'empreinte de ses fichiers, construite seulement si elle n'existe
      # pas encore. Ses couches restent identiques d'une version à l'autre de
      # l'application : le NAS ne les télécharge qu'une fois.
      - name: Base image tag
        id: base
        run: |
          hash=$(sha256sum Dockerfile.base | cut -c1-16)
          name="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')-base"
          echo "image=${name}:lite-${hash}" >> "$GITHUB_OUTPUT"
          echo "moving=${name}:lite" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${name}:lite-${hash}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Hors PR : publiée sous son empreinte ; l'étiquette mobile `:lite` (défaut
      # du Dockerfile pour un build local) ne bouge que depuis la branche principale.
      - name: Build and push base image
        if: steps.base.outputs.exists != 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          target: lite
          push: true
          tags: |
            ${{ steps.base.outputs.image }}
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.base.outputs.moving || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # PR qui change Dockerfile.base : la base est construite pour la vérifier,
      # sans être publiée. L'image de l'application, qui en dépend, sera
      # construite après le merge.
      - name: Build base image (pull request, not pushed)
        if: steps.base.outputs.exists != 'true' && github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          target: lite
          push: false

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `sha-<commit>` : chaque version publiée reste disponible, pour
          # revenir en arrière sur le NAS si `latest` pose problème.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Sur une pull request, l'image est construite SANS être publiée : une
      # erreur du Dockerfile est vue avant le merge, pas après.
      - name: Build and push Docker image
        if: steps.base.outputs.exists == 'true' || github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # Étages légers (Node, Rust) : tout est mis en cache (mode=max) ;
          # un échec d'export du cache ne fait jamais échouer la publication.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
