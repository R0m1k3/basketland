name: Android

# Appli Android (dossier android/) : lint, tests et APK de debug sur chaque PR qui
# touche l'appli ; APK signé publié en Release GitHub sur un tag android-vX.Y.Z.
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    tags: ['android-v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint, tests, APK de debug
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: basketland-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # android-v1.2.3 → versionName 1.2.3, versionCode 10203.
      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#android-v}"
          if ! printf %s "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag invalide : $TAG (attendu android-vX.Y.Z)" >&2
            exit 1
          fi
          major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: APK signé
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BL_VERSION_NAME: ${{ steps.version.outputs.name }}
          BL_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf %s "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | grep -i sha-256
          cp "$apk" "basketland-$BL_VERSION_NAME.apk"
          # Nom fixe : lien stable …/releases/latest/download/basketland.apk (Downloader sur TV).
          cp "$apk" basketland.apk

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" "basketland-$VERSION.apk" basketland.apk \
            --title "Application Android $VERSION" \
            --notes "APK signé pour téléphone, Android TV / Google TV et Fire TV. Installation : voir le README (section Application Android)."
