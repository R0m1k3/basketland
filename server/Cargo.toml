[package]
name = "basketland-server"
version = "0.1.0"
edition = "2021"
description = "Serveur Basketland : passerelle HTTP en Rust devant l'application Next.js, qui reprend les routes une à une"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
form_urlencoded = "1"
percent-encoding = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "stream", "http2", "multipart"] }
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
base64 = "0.22"
subtle = "2"
url = "2"
regex = "1"
indexmap = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
unicode-normalization = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# scrypt (N = 2^15) est très lent sans optimisation : tests et dev en dépendent.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
